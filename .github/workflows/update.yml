name: Auto Update TVBox Configs

# 注意：GitHub Actions 的 on 字段需加引号，避免被部分 YAML 解析器当作布尔值
"on":
  # 定时触发：每天 02:00 和 14:00（UTC）自动更新
  schedule:
    - cron: "0 2,14 * * *"
  # 支持在 GitHub Actions 页面手动触发
  workflow_dispatch:
  # 修改配置或脚本后 push 时触发（仅监听 config/scripts，避免自动提交 output/ 引发死循环）
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "scripts/**"
      - "requirements.txt"

# 赋予 GITHUB_TOKEN 写仓库权限，用于把更新结果提交回仓库
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: auto-update
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        run: python scripts/update.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::没有内容变化，跳过提交"
          else
            git commit -m "chore: 自动更新影视仓配置 $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            # 一轮跑几分钟，期间若有人手动推送，本地 HEAD 就落后于远程，
            # 直接 push 会被拒（! [rejected] ... fetch first）。
            # 先变基到最新远程再推，并最多重试 5 次。
            # -X theirs：output/ 是本流程生成物，冲突时以本次生成结果为准。
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs --autostash origin main && git push origin main; then
                echo "::notice::配置已更新并推送到 main 分支（第 $i 次尝试成功）"
                exit 0
              fi
              echo "::warning::第 $i 次推送失败，5 秒后重试"
              sleep 5
            done
            echo "::error::连续 5 次推送失败，请检查分支保护规则或仓库权限设置"
            exit 1
          fi

      # jsDelivr 对分支引用有约 12 小时缓存。配置更新后不刷新的话，
      # 电视盒子/播放器会继续拿到旧配置（旧配置里还是被污染的 raw 地址）。
      - name: Purge jsDelivr CDN cache
        run: |
          # 先等 5 分钟，让 raw.githubusercontent.com 自身的缓存过期，
          # 否则 jsDelivr 回源会取到旧内容并把它再缓存 12 小时。
          sleep 300
          for f in subscribe.json all.json; do
            echo "purge $f"
            curl -s -o /dev/null -w "%{http_code}\n" \
              "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/output/$f" || true
          done
          echo "::notice::jsDelivr 缓存已刷新"
